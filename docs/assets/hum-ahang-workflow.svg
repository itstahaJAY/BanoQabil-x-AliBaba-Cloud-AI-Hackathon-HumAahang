<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1250" viewBox="0 0 1440 1250" role="img" aria-labelledby="title desc">
<title id="title">Hum Ahang — complete product workflow</title><desc id="desc">Six user journeys, cloud and device boundaries, private judge access and accessibility safeguards. Full text equivalent in docs/workflow.md.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#152344}.title{font-size:48px;font-weight:700;fill:white}.sub{font-size:19px;fill:#cfd8ff}.label{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:15px}.white{fill:white}.muted{fill:#516078}.cloud{fill:#f2edff;stroke:#c6b6f5}.local{fill:#e9f7f5;stroke:#a4d8d2}.exp{fill:#fff5df;stroke:#eec876}.box{stroke-width:1.5}.arrow{stroke:#71819a;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#71819a"/></marker></defs>
<rect width="1440" height="1250" fill="#f5f7fc"/>
<rect width="1440" height="158" fill="#121d3d"/>
<text x="48" y="70" class="title">Hum Ahang</text><text x="49" y="107" class="sub">Urdu-first accessibility companion · Product workflow</text>
<rect x="1120" y="41" width="270" height="40" rx="20" fill="#293658"/><text x="1255" y="67" text-anchor="middle" class="body white">HACKATHON MVP · 2026</text>
<text x="48" y="191" class="small muted">START HERE</text>
<rect x="48" y="207" width="405" height="99" rx="15" fill="white" stroke="#dbe2ef"/>
<text x="68" y="239" class="label">Open the app → Home</text><text x="68" y="266" class="body">First run: language + communication profile</text><text x="68" y="289" class="small muted">English / Urdu / Roman Urdu menus</text>
<path d="M459 253H484" class="arrow"/>
<rect x="494" y="207" width="432" height="99" rx="15" class="cloud box"/>
<text x="514" y="239" class="label">Cloud access, without a terminal</text><text x="514" y="266" class="body">Private judge link → temporary session</text><text x="514" y="289" class="small muted">Operator pairing fallback · keys stay server-side</text>
<rect x="948" y="207" width="444" height="99" rx="15" fill="white" stroke="#dbe2ef"/>
<text x="968" y="239" class="label">Profile → Settings</text><text x="968" y="266" class="body">Language, accessibility and passport details</text><text x="968" y="289" class="small muted">Trusted contact + verified service numbers</text>
<text x="48" y="341" class="small muted">CHOOSE A JOURNEY · VISIBLE BUTTONS ALWAYS AVAILABLE</text>
<g><rect x="48" y="361" width="1344" height="104" rx="14" fill="white" stroke="#dce3ef"/><rect x="48" y="361" width="259" height="104" rx="14" fill="#6b46cb"/><text x="67" y="390" class="small white">01</text><text x="67" y="425" class="label white">Live Captions</text><rect x="327" y="371" width="324" height="56" rx="9" class="cloud box"/><text x="341" y="394" class="body">Choose Urdu / English input</text><text x="341" y="416" class="body">Tap microphone to start</text><path d="M655 399h20" class="arrow"/><rect x="681" y="371" width="324" height="56" rx="9" class="cloud box"/><text x="695" y="394" class="body">OpenAI speech → DeepSeek</text><text x="695" y="416" class="body">Validated Urdu + English pair</text><path d="M1009 399h20" class="arrow"/><rect x="1035" y="371" width="324" height="56" rx="9" class="local box"/><text x="1049" y="394" class="body">Read either output tab</text><text x="1049" y="416" class="body">Stop → optionally save text</text><text x="341" y="451" class="small muted">Input changes only while stopped. Output tabs are independent; mixed-speech accuracy is limited.</text></g><g><rect x="48" y="477" width="1344" height="104" rx="14" fill="white" stroke="#dce3ef"/><rect x="48" y="477" width="259" height="104" rx="14" fill="#087f85"/><text x="67" y="506" class="small white">02</text><text x="67" y="541" class="label white">Conversation + FTF</text><rect x="327" y="487" width="324" height="56" rx="9" class="local box"/><text x="341" y="510" class="body">Choose speaker A or B</text><text x="341" y="532" class="body">Type, phrases or device dictation</text><path d="M655 515h20" class="arrow"/><rect x="681" y="487" width="324" height="56" rx="9" class="local box"/><text x="695" y="510" class="body">Send to shared conversation</text><text x="695" y="532" class="body">FTF: two opposing panels</text><path d="M1009 515h20" class="arrow"/><rect x="1035" y="487" width="324" height="56" rx="9" class="local box"/><text x="1049" y="510" class="body">Partner reads the message</text><text x="1049" y="532" class="body">Optional device read-aloud</text><text x="341" y="567" class="small muted">Explicit speaker ownership, not automatic alternation. Dictation may use the device provider's online service.</text></g><g><rect x="48" y="593" width="1344" height="104" rx="14" fill="white" stroke="#dce3ef"/><rect x="48" y="593" width="259" height="104" rx="14" fill="#087f85"/><text x="67" y="622" class="small white">03</text><text x="67" y="657" class="label white">Quick Speak</text><rect x="327" y="603" width="324" height="56" rx="9" class="local box"/><text x="341" y="626" class="body">Browse or filter phrases</text><text x="341" y="648" class="body">Or enter a custom message</text><path d="M655 631h20" class="arrow"/><rect x="681" y="603" width="324" height="56" rx="9" class="local box"/><text x="695" y="626" class="body">Device text-to-speech</text><text x="695" y="648" class="body">Selected language / available voice</text><path d="M1009 631h20" class="arrow"/><rect x="1035" y="603" width="324" height="56" rx="9" class="local box"/><text x="1049" y="626" class="body">Play the spoken message</text><text x="1049" y="648" class="body">Stop playback when needed</text><text x="341" y="683" class="small muted">Uses device voices, not a paid cloud TTS pipeline. Voice availability and pronunciation depend on the device.</text></g><g><rect x="48" y="709" width="1344" height="104" rx="14" fill="white" stroke="#dce3ef"/><rect x="48" y="709" width="259" height="104" rx="14" fill="#6b46cb"/><text x="67" y="738" class="small white">04</text><text x="67" y="773" class="label white">AI Vision</text><rect x="327" y="719" width="324" height="56" rx="9" class="local box"/><text x="341" y="742" class="body">Capture → review photo</text><text x="341" y="764" class="body">Tap Analyze to upload</text><path d="M655 747h20" class="arrow"/><rect x="681" y="719" width="324" height="56" rx="9" class="cloud box"/><text x="695" y="742" class="body">Backend → OpenAI vision</text><text x="695" y="764" class="body">Objects, description, uncertainty</text><path d="M1009 747h20" class="arrow"/><rect x="1035" y="719" width="324" height="56" rx="9" class="local box"/><text x="1049" y="742" class="body">English / Urdu / Roman Urdu</text><text x="1049" y="764" class="body">Optional device read-aloud</text><text x="341" y="799" class="small muted">Changing result language translates text only; the photo is not resent. Not a safety or navigation guarantee.</text></g><g><rect x="48" y="825" width="1344" height="104" rx="14" fill="white" stroke="#dce3ef"/><rect x="48" y="825" width="259" height="104" rx="14" fill="#ad6c0b"/><text x="67" y="854" class="small white">05</text><text x="67" y="889" class="label white">Sign Assistant</text><rect x="327" y="835" width="324" height="56" rx="9" class="local box"/><text x="341" y="858" class="body">Capture and review a hand photo</text><text x="341" y="880" class="body">Explicitly request analysis</text><path d="M655 863h20" class="arrow"/><rect x="681" y="835" width="324" height="56" rx="9" class="exp box"/><text x="695" y="858" class="body">Backend → OpenAI vision</text><text x="695" y="880" class="body">Six static poses or unknown</text><path d="M1009 863h20" class="arrow"/><rect x="1035" y="835" width="324" height="56" rx="9" class="local box"/><text x="1049" y="858" class="body">Read the hand-pose result</text><text x="1049" y="880" class="body">Optional device read-aloud</text><text x="341" y="915" class="small muted">Experimental pose aid only: not PSL, ASL, moving-sign translation or a substitute for an interpreter.</text></g><g><rect x="48" y="941" width="1344" height="104" rx="14" fill="white" stroke="#dce3ef"/><rect x="48" y="941" width="259" height="104" rx="14" fill="#087f85"/><text x="67" y="970" class="small white">06</text><text x="67" y="1005" class="label white">Passport + Emergency</text><rect x="327" y="951" width="324" height="56" rx="9" class="local box"/><text x="341" y="974" class="body">Load details saved in Settings</text><text x="341" y="996" class="body">Open card or emergency actions</text><path d="M655 979h20" class="arrow"/><rect x="681" y="951" width="324" height="56" rx="9" class="local box"/><text x="695" y="974" class="body">Show card / reveal contact QR</text><text x="695" y="996" class="body">Or review a phone handoff</text><path d="M1009 979h20" class="arrow"/><rect x="1035" y="951" width="324" height="56" rx="9" class="local box"/><text x="1049" y="974" class="body">Explicitly share or continue call</text><text x="1049" y="996" class="body">No action merely from navigation</text><text x="341" y="1031" class="small muted">QR contains only the trusted contact number. No automatic calls, location tracking, notifications or dispatch.</text></g>
<rect x="48" y="1073" width="1344" height="61" rx="12" fill="#e9edf8"/>
<text x="67" y="1097" class="body">Optional navigation pad: ↑ Vision · ↓ Emergency · → Captions · ← FTF · ⇇ Sign · ⇉ Passport</text>
<text x="67" y="1120" class="small muted">Double swipes suppress single actions. Normal scrolling and screen-reader controls remain; gestures can be disabled.</text>
<text x="48" y="1170" class="small">LOCAL: profile, preferences and saved caption text; not encrypted by the app. Server does not store captured audio or photos.</text>
<text x="48" y="1195" class="small">PLATFORM: deployed HTTPS web demo recommended. Expo Go lacks native microphone modules; use a development build.</text>
<circle cx="57" cy="1224" r="6" fill="#6b46cb"/><text x="72" y="1229" class="small">Cloud AI</text><circle cx="205" cy="1224" r="6" fill="#087f85"/><text x="220" y="1229" class="small">Device / local</text><circle cx="387" cy="1224" r="6" fill="#ad6c0b"/><text x="402" y="1229" class="small">Experimental</text><text x="1392" y="1229" text-anchor="end" class="small muted">Editable source · docs/assets/hum-ahang-workflow.svg</text>
</svg>
